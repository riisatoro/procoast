services:
  procoast-db:
    build: ./database
    container_name: procoast-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - procoast_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  procoast-be:
    build: ./backend
    container_name: procoast-be
    env_file: .env
    environment:
      POSTGRES_HOST: procoast-db
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      procoast-db:
        condition: service_healthy

  procoast-fe:
    build: ./frontend
    container_name: procoast-fe
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      - procoast-be

  procoast-ui-example:
    build: ./ui-example
    container_name: procoast-ui-example
    ports:
      - "3020:3020"

volumes:
  procoast_pgdata:
