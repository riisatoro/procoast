services:
  procoast-db:
    build: ./database
    container_name: procoast-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - procoast_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  procoast-be:
    build: ./backend
    container_name: procoast-be
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: procoast-db
    volumes:
      - ./backend:/app
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      procoast-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  procoast-fe:
    build: ./frontend
    container_name: procoast-fe
    ports:
      - "0.0.0.0:3000:80"
    depends_on:
      - procoast-be

volumes:
  procoast_pgdata:
